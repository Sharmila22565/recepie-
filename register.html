<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - RecipeShare</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🍴</span>
        <div>
          <span>RecipeShare</span>
          <span class="logo-tag">Discover. Cook. Share.</span>
        </div>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
        <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
      </div>
    </div>
  </header>

  <!-- Register Area -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🍴 RecipeShare</div>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join our vibrant culinary community today</p>
      </div>

      <div class="alert-box alert-danger" id="register-alert"></div>

      <form class="auth-form" id="register-form">
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name *</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Sanjeev Kapoor" required />
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address *</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="reg-email" class="form-input" placeholder="chef@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">Password * (min 6 characters)</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
            <span class="password-toggle-btn" id="toggle-reg-pwd">👁️</span>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password *</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="reg-submit-btn" style="width:100%;margin-top:10px;">
          Create Account 🎉
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Password toggle
    const toggleBtn = document.getElementById('toggle-reg-pwd');
    const pwdInput = document.getElementById('reg-password');
    if (toggleBtn && pwdInput) {
      toggleBtn.onclick = () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        toggleBtn.textContent = isPwd ? '🙈' : '👁️';
      };
    }

    // Register Form Submit
    const regForm = document.getElementById('register-form');
    const alertBox = document.getElementById('register-alert');
    const submitBtn = document.getElementById('reg-submit-btn');

    regForm.onsubmit = async (e) => {
      e.preventDefault();
      alertBox.classList.remove('show');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match. Please re-check.';
        alertBox.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await Auth.register(name, email, password, confirmPassword);
        showToast(res.message || 'Account created successfully! Welcome to RecipeShare.', 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (err) {
        alertBox.textContent = err.message || 'Registration failed. Please try again.';
        alertBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account 🎉';
      }
    };
  </script>
</body>
</html>
